services:
    mysql:
        image: mysql:5.7
        container_name: mysql
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: testdb
            MYSQL_USER: test
            MYSQL_PASSWORD: test
        ports:
            - "3306:3306"
        volumes:
            - ./mysql:/var/lib/mysql
    node:
        image: node:12
        container_name: node
        working_dir: /app
        volumes:
            - ./htmx-course:/app
        command: tail -f /dev/null
        ports:
            - "1330:1330"
            - "5050:5000"
